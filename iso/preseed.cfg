# ==============================================================================
# PhantomNode OS - Debian installer preseed
#
# Automates everything except the decisions the operator must make:
#   - keyboard layout
#   - which disk to erase
#   - the full-disk encryption passphrase
#   - the operator account password
# PhantomNode itself is installed on first boot by phantom-firstboot.service.
# ==============================================================================

### Localization (keyboard is still asked)
d-i debian-installer/language string en
d-i debian-installer/country string US
d-i debian-installer/locale string en_US.UTF-8

### Network: DHCP on the first interface with a link
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string phantom-node
d-i netcfg/get_domain string
d-i netcfg/hostname string phantom-node
# Load missing firmware from the installer media without prompting
d-i hw-detect/load_firmware boolean true

### Mirror
d-i mirror/country string manual
d-i mirror/protocol string https
d-i mirror/https/hostname string deb.debian.org
d-i mirror/https/directory string /debian
d-i mirror/https/proxy string

### Accounts: no root password (sudo only), one operator account
d-i passwd/root-login boolean false
d-i passwd/user-fullname string PhantomNode Operator
d-i passwd/username string phantom
# passwd/user-password is asked interactively

### Clock: UTC, so the system timezone does not reveal the operator's location
d-i clock-setup/utc boolean true
d-i time/zone string Etc/UTC
d-i clock-setup/ntp boolean true

### Partitioning: LUKS2-encrypted LVM over the whole disk (swap is inside LUKS too)
# The disk choice, the final "write changes" confirmation and the encryption
# passphrase are deliberately NOT preseeded.
d-i partman-auto/method string crypto
d-i partman-auto-lvm/guided_size string max
d-i partman-auto/choose_recipe select atomic
d-i partman-auto-lvm/new_vg_name string phantom-vg
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
# Overwriting the disk with random data can take hours on large drives.
# Skipped for install speed; data written later is still fully encrypted.
d-i partman-auto-crypto/erase_disks boolean false
d-i partman-efi/non_efi_system boolean true

### Packages
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/contrib boolean false
d-i apt-setup/services-select multiselect security, updates
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string sudo curl ca-certificates git rsync cryptsetup-initramfs
d-i pkgsel/upgrade select full-upgrade
popularity-contest popularity-contest/participate boolean false

### Bootloader
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean false
d-i grub-installer/bootdev string default

### Hand over to PhantomNode: copy the bundled source and enable first-boot setup
d-i preseed/late_command string \
    mkdir -p /target/opt/phantom-node-src ; \
    cp -a /cdrom/phantom-node/. /target/opt/phantom-node-src/ ; \
    chown -R 0:0 /target/opt/phantom-node-src ; \
    install -m 0644 /cdrom/phantom-node/iso/phantom-firstboot.service /target/etc/systemd/system/phantom-firstboot.service ; \
    in-target systemctl enable phantom-firstboot.service ; \
    in-target usermod -aG sudo phantom

d-i finish-install/reboot_in_progress note
