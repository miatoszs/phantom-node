services:
  monerod:
    image: sethsimmons/simple-monerod:latest
    container_name: monerod
    restart: unless-stopped
    volumes:
      - monero_data:/home/monero/.bitmonero
    ports:
      # P2P port
      - "18080:18080"
      # Restricted RPC port on localhost only
      - "127.0.0.1:18081:18081"
      # ZMQ port for P2Pool
      - "127.0.0.1:18084:18084"
    command:
      - "--rpc-restricted-bind-ip=0.0.0.0"
      - "--rpc-restricted-bind-port=18081"
      - "--confirm-external-bind"
      - "--no-igd"
      - "--enable-dns-blocklist"
      - "--prune-blockchain"
      - "--zmq-pub=tcp://0.0.0.0:18084"
    security_opt:
      - no-new-privileges:true

  dashboard:
    image: brechtdoran/monero-node-dashboard:latest
    container_name: monero_dashboard
    restart: unless-stopped
    depends_on:
      - monerod
    environment:
      - MONERO_HOST=monerod
      - MONERO_PORT=18081
    ports:
      - "127.0.0.1:18088:3000"
    security_opt:
      - no-new-privileges:true

volumes:
  monero_data:
