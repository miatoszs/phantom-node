services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    command: --transaction-isolation=READ-COMMITTED --binlog-format=ROW
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - nextcloud_internal
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:alpine
    restart: unless-stopped
    networks:
      - nextcloud_internal
    security_opt:
      - no-new-privileges:true

  app:
    image: nextcloud:fpm-alpine
    restart: unless-stopped
    depends_on:
      - db
      - redis
    environment:
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
      - MYSQL_HOST=db
      - REDIS_HOST=redis
      - NEXTCLOUD_TRUSTED_DOMAINS=*
    volumes:
      - nextcloud_data:/var/www/html
    networks:
      - nextcloud_internal
    security_opt:
      - no-new-privileges:true

  web:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      # Expose only on localhost loopback - Zero WAN port opening!
      - "9639:80"
    volumes:
      - nextcloud_data:/var/www/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - nextcloud_internal
    security_opt:
      - no-new-privileges:true

volumes:
  db_data:
  nextcloud_data:

networks:
  nextcloud_internal:
    driver: bridge
