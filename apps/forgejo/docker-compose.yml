services:
  server:
    image: codeberg.org/forgejo/forgejo:12
    container_name: forgejo
    restart: unless-stopped
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - FORGEJO__service__DISABLE_REGISTRATION=true
      - FORGEJO__service__ENABLE_NOTIFY_MAIL=false
      - FORGEJO__ui__DEFAULT_THEME=gitea-dark
    volumes:
      - forgejo_data:/data
    ports:
      - "3009:3000"
      - "2222:22"
    # Prevent DNS leaks
    dns:
      - 127.0.0.1
    security_opt:
      - no-new-privileges:true

volumes:
  forgejo_data:
