services:
  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:latest
    container_name: phantom_wgeasy
    restart: unless-stopped
    environment:
      - PASSWORD_HASH=1563362a15633612156336examplehashforwebui
      - WG_PORT=51820
      - WG_HOST=127.0.0.1
    ports:
      - "51820:51820/udp"
      - "51821:51821/tcp"
    volumes:
      - ./data:/etc/wireguard
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv4.ip_forward=1
